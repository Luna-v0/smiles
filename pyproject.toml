[project]
name = "slyparser"
version = "0.1.0"
description = "A LALR(1) parser using SLY"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.10.8",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.12",
  "mkdocstrings[python]>=0.29.1",
  "molvs>=0.1.1",
  "networkx>=3.4.2",
  "notebook>=7.4.1",
  "pandas>=2.2.3",
  "partialsmiles>=2.0",
  "pyarrow>=24.0.0",
  "pymdown-extensions>=10.15",
  "pysmiles>=2.0.1",
  "pytest>=8.3.5",
  "rdkit>=2025.9.4",
  "scipy>=1.15.3",
  "seaborn>=0.13.2",
  "sly>=0.5,<0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "catppuccin-jupyterlab>=0.2.5",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter-collaboration>=4.4.2",
    "jupyter-mcp-tools>=0.1.6",
    "jupyterlab>=4.5.6",
    "jupyterlab-git>=0.54.1",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "jupytext>=1.19.5",
    "lckr-jupyterlab-variableinspector>=3.2.4",
    "pycrdt>=0.13.1",
    "python-lsp-server[all]>=1.15.0",
]
